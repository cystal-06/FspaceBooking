version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fspace-postgres
    restart: always
    environment:
      POSTGRES_DB: fspace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fspace_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend_db/fspace_schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
